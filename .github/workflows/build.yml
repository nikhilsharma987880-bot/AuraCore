name: Build AuraCore

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-binaries
          path: target/release/
